# 建置 Windows（exe + 安裝程式）與 macOS（.app 的 zip / dmg）；設定好 SignPath 後 Windows 版自動送簽章。
# 觸發：推送 v* 標籤（例如 v2.1）或在 Actions 頁面手動執行。
name: Build and sign release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write        # 建立 GitHub Release
  actions: read          # SignPath 讀取建置產物

env:
  # SignPath 設定：申請通過後，在 repo 的 Settings → Secrets and variables → Actions 填入
  SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
  SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
  SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG || 'cgu-pdf-tool' }}
  SIGNPATH_POLICY_SLUG: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Smoke test
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/smoke_test.py

      # ---------- 1. 執行檔 ----------
      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean CGU_PDF_Tool.spec

      - name: Upload unsigned executable
        id: upload-unsigned-exe
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-exe
          path: dist/CGU_PDF_Tool.exe
          if-no-files-found: error

      - name: Sign executable (SignPath)
        if: env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: exe
          github-artifact-id: ${{ steps.upload-unsigned-exe.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600     # 等待人工核准
          output-artifact-directory: signed-exe

      - name: Use signed executable
        if: env.SIGNPATH_API_TOKEN != ''
        run: Copy-Item signed-exe/CGU_PDF_Tool.exe dist/CGU_PDF_Tool.exe -Force

      # ---------- 2. 安裝程式 ----------
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'

      - name: Upload unsigned installer
        id: upload-unsigned-installer
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-installer
          path: dist/CGU_PDF_Tool_Setup_*.exe
          if-no-files-found: error

      - name: Sign installer (SignPath)
        if: env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.upload-unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-installer

      - name: Collect release files
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          if ($env:SIGNPATH_API_TOKEN) {
            Copy-Item signed-installer/*.exe release/
          } else {
            Copy-Item dist/CGU_PDF_Tool_Setup_*.exe release/
          }
          Copy-Item dist/CGU_PDF_Tool.exe release/

      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release/*

  build-macos:
    runs-on: macos-14            # Apple Silicon（M 系列）
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Smoke test
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/smoke_test.py

      - name: Build app
        run: python -m PyInstaller --noconfirm --clean CGU_PDF_Tool_mac.spec

      - name: Check app opens a PDF
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "import fitz; d=fitz.open(); d.new_page().insert_text((72,72),'test'); d.save('ci_check.pdf')"
          "dist/CGU PDF Tool.app/Contents/MacOS/CGU PDF Tool" --check-open ci_check.txt ci_check.pdf
          cat ci_check.txt

      - name: Package zip and dmg
        run: |
          VER=$(python -c "import re;print(re.search(r'^APP_VERSION = \"V([^\"]+)\"', open('pdf_tool.py',encoding='utf-8').read(), re.M).group(1))")
          mkdir -p release
          # zip：解壓縮就是 .app，免安裝
          ditto -c -k --sequesterRsrc --keepParent "dist/CGU PDF Tool.app" "release/CGU_PDF_Tool_mac_${VER}.zip"
          # dmg：打開後把 App 拖到「應用程式」
          mkdir -p dmg && cp -R "dist/CGU PDF Tool.app" dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname "CGU PDF Tool ${VER}" -srcfolder dmg -ov -format UDZO "release/CGU_PDF_Tool_mac_${VER}.dmg"
          ls -lh release

      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: release/*

  # 推送標籤時建立「草稿」Release（含 Windows 與 Mac 檔案），確認後再按發布
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release

      - name: Create draft GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: release/*
